<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성경학교 조편성표</title>

<style>
  body {
    font-family: system-ui;
    background: #f7f7f7;
    padding: 20px;
  }

  h1 {
    text-align: center;
    margin-bottom: 15px;
  }

  /* 검색창 */
  #searchBox {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #ccc;
    margin-bottom: 18px;
    font-size: 1rem;
  }

  /* 안내 박스 */
  .info-box {
    background: #ffffff;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    margin-bottom: 20px;
    font-size: 0.95rem;
    line-height: 1.7;
  }

  .info-box div {
    margin-bottom: 6px;
  }

  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
  }

  .group-box {
    background: #fff;
    border-radius: 12px;
    margin-bottom: 15px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    overflow: hidden;
  }

  .group-header {
    padding: 15px;
    color: white;
    font-size: 1.1rem;
    font-weight: 700;
  }

  .leader-list {
    margin-bottom: 12px;
    padding-left: 5px;
  }

  .leader-item {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }

  .group-content {
    padding: 15px;
    background: #fafafa;
    font-size: 0.95rem;
  }

  .student-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 15px;
  }

  .student-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .back-btn {
    display: block;
    width: 100%;
    text-align: center;
    padding: 12px;
    background: #6c5ce7;
    color: white;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
    margin-top: 20px;
  }
</style>
</head>

<body>

<h1>📚 성경학교 조편성표</h1>

<input id="searchBox" type="text" placeholder="이름 검색…" onkeyup="searchGroup()">

<!-- 요일별 색상 규칙 안내 -->
<div class="info-box">
  <strong>📅 요일별 색상 규칙(파란색조는 토요일만)</strong><br><br>
  <div><span class="dot" style="background:#3498db;"></span> 토요일만 오는 친구</div>
  <div><span class="dot" style="background:#2ecc71;"></span> 금요일만 오는 친구</div>
  <div><span class="dot" style="background:#bdc3c7;"></span> 금·토 모두 오는 친구</div>
</div>

<div id="groups"></div>

<a class="back-btn" href="index.html">← 메인으로 돌아가기</a>

<script>

    "#3498db", "#3498db", "#3498db", "#3498db"
  ];

  function dayColor(day) {
    if (day === "sat") return "#3498db";
    if (day === "fri") return "#2ecc71";
    return "#bdc3c7";
  }

  /* === 기존 groupsData 그대로 사용 === */

        ["차영광","5학년","대곡","both"],
        ["김민서","2학년","대곡","both"],
        ["김리주","3학년","구덕","both"],
        ["이찬빈","2학년","구덕","sat"],
        ["이조이","5세","구덕","both"]
      ]
    },

    {
      group: "2조",
      leader: [
        ["김다은","both"],

      ],

        ["김도연","4학년","구덕","both"],
        ["오현우","7세","구덕","fri"],
        ["허아현","2세","구덕","sat"]
      ]
    },

    {
      group: "3조",
      leader: [
        ["이주현","both"],
        ["이홍은","both"],

      ],
      students: [
        ["차기쁨","중3","대곡","fri"],

      ],

        ["김늘찬","2학년","구덕","both"],

    {

    {

      leader: [

      ],
      students: [
        ["박진우","6학년","구덕","sat"],
        ["권민찬","3학년","구덕","sat"],
        ["허재준","1학년","구덕","sat"],
        ["김율","5세","구덕","sat"],
        ["장가을","4세","구덕","sat"]
      ]
    }
  ];

  /* ============================
     렌더링 함수
  ============================ */
  function renderGroups(data) {
    const container = document.getElementById("groups");
    container.innerHTML = "";

    data.forEach((g, i) => {
      const box = document.createElement("div");
      box.className = "group-box";

      const header = document.createElement("div");
      header.className = "group-header";
      header.style.background = groupColors[i];
      header.textContent = `${groupIcons[i]} ${g.group}`;

      const content = document.createElement("div");
      content.className = "group-content";

      /* 조장 */
      const leaderList = document.createElement("div");
      leaderList.className = "leader-list";

      g.leader.forEach(l => {
        const leaderItem = document.createElement("div");
        leaderItem.className = "leader-item";

        const dayDot = document.createElement("span");
        dayDot.className = "dot";
        dayDot.style.background = dayColor(l[1]);

        const name = document.createElement("span");
        name.textContent = `${l[0]} (조장)`;

        leaderItem.appendChild(dayDot);
        leaderItem.appendChild(name);
        leaderList.appendChild(leaderItem);
      });

      content.appendChild(leaderList);

      /* 학생 */
      const list = document.createElement("div");
      list.className = "student-list";

      g.students.forEach(s => {
        const item = document.createElement("div");
        item.className = "student-item";

        const dayDot = document.createElement("span");
        dayDot.className = "dot";
        dayDot.style.background = dayColor(s[3]);

        const text = document.createElement("span");
        text.textContent = `${s[0]} (${s[1]}, ${s[2]})`;

        item.appendChild(dayDot);
        item.appendChild(text);
        list.appendChild(item);
      });

      content.appendChild(list);
      box.appendChild(header);
      box.appendChild(content);
      container.appendChild(box);
    });
  }

  /* ============================
     검색 기능
  ============================ */
  function searchGroup() {
    const keyword = document.getElementById("searchBox").value.trim();

    if (keyword === "") {
      renderGroups(groupsData);
      return;
    }

    const matched = groupsData.filter(g => {
      const leaderMatch = g.leader.some(l => l[0].includes(keyword));
      const studentMatch = g.students.some(s => s[0].includes(keyword));
      return leaderMatch || studentMatch;
    });

    renderGroups(matched);
  }

  /* 첫 렌더링 */
  renderGroups(groupsData);
</script>

</body>
</html>
