<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성경학교 조편성표</title>

<style>
  body {
    font-family: system-ui;
    background: #f7f7f7;
    padding: 20px;
  }

  h1 {
    text-align: center;
    margin-bottom: 25px;
  }

  .group-box {
    background: #fff;
    border-radius: 12px;
    margin-bottom: 15px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    overflow: hidden;
  }

  .group-header {
    padding: 15px;
    color: white;
    font-size: 1.1rem;
    font-weight: 700;
  }

  .group-content {
    padding: 15px;
    background: #fafafa;
    font-size: 0.95rem;
  }

  .student-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 15px;
  }

  .student-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .grade-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    display: inline-block;
  }

  .back-btn {
    display: block;
    width: 100%;
    text-align: center;
    padding: 12px;
    background: #6c5ce7;
    color: white;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
    margin-top: 20px;
  }
</style>
</head>

<body>

<h1>📚 성경학교 조편성표</h1>

<div id="groups"></div>

<a class="back-btn" href="index.html">← 메인으로 돌아가기</a>

<script>
  const groupIcons = ["🐳","🐬","🐢","🐟","🐙","🦀","🐠","🐡","🦑","🐋","🌊"];
  const groupColors = [
    "#6c5ce7", "#0984e3", "#00b894", "#fdcb6e", "#e17055",
    "#d63031", "#00cec9", "#30336b", "#e84393", "#6ab04c", "#636e72"
  ];

  function gradeColor(grade) {
    if (grade.includes("세")) return "#f1c40f";      // 유치부
    if (grade.includes("1학년") || grade.includes("2학년")) return "#2ecc71";
    if (grade.includes("3학년") || grade.includes("4학년")) return "#3498db";
    if (grade.includes("5학년") || grade.includes("6학년")) return "#9b59b6";
    if (grade.includes("중")) return "#e74c3c";       // 중학생
    return "#7f8c8d"; // 기타
  }

  const groupsData = [
    {
      group: "1조",
      leader: "정하은, 김정태",
      students: [
        ["차영광","5학년","대곡"],
        ["오하람","5학년","구덕"],
        ["김리주","3학년","구덕"],
        ["이찬빈","2학년","구덕"],
        ["김보경","4세","유치부"]
      ]
    },
    {
      group: "2조",
      leader: "김다은, 주익한, 박지은",
      students: [
        ["신예정","4학년","대곡"],
        ["김도연","4학년","구덕"],
        ["김보민","3학년","구덕"],
        ["오현우","7세","구덕"],
        ["허아현","2세","유치부"]
      ]
    },
    {
      group: "3조",
      leader: "이주현, 이홍은, 정은경",
      students: [
        ["김시온","6학년","대곡"],
        ["오하율","4학년","구덕"],
        ["오민하","3학년","구덕"],
        ["이나은","1학년","구덕"],
        ["최혜온","6세","유치부"]
      ]
    },
    {
      group: "4조",
      leader: "이수연, 이황인",
      students: [
        ["김도윤","4학년","대곡"],
        ["김늘찬","2학년","구덕"],
        ["이가빈","1학년","구덕"],
        ["김선우","4학년","구덕"],
        ["모준서","5세","유치부"]
      ]
    },
    {
      group: "5조",
      leader: "김재현a, 김은진",
      students: [
        ["김도현","2학년","대곡"],
        ["이예빈","4학년","구덕"],
        ["양다은","2학년","구덕"],
        ["진세준","7세","유치부"]
      ]
    },
    {
      group: "6조",
      leader: "박근혜, 김수겸, 김유진",
      students: [
        ["김열매","5학년","구덕"],
        ["송예담","3학년","구덕"],
        ["진하은","3세","유치부"],
        ["김유라","1학년","유치부"]
      ]
    },
    {
      group: "7조",
      leader: "김재현, 정하용",
      students: [
        ["김도엽","1학년","대곡"],
        ["김도희","6세","대곡"],
        ["김지유","중2","구덕"],
        ["오하준","6학년","구덕"],
        ["이조이","5세","유치부"],
        ["이하율","5학년","구덕"]
      ]
    },
    {
      group: "8조",
      leader: "박은주, 권주영",
      students: [
        ["신예준","중1","대곡"],
        ["김아셀","중1","대곡"],
        ["김민준","6학년","구덕"],
        ["서지우","2학년","구덕"],
        ["탁이현","7세","유치부"],
        ["강윤재","6세","유치부"]
      ]
    },
    {
      group: "9조",
      leader: "강태호, 허종웅, 신민경, 최유정",
      students: [
        ["신범준","중1","대곡"],
        ["김하운","6학년","구덕"],
        ["김연주","4학년","구덕"],
        ["김라희","4세","유치부"],
        ["최혜준","3세","유치부"]
      ]
    },
    {
      group: "10조",
      leader: "최용임, 한유정, 정여원",
      students: [
        ["권보현","중1","대곡"],
        ["박선우","5학년","구덕"],
        ["김효주","중1","구덕"],
        ["이동호","1학년","구덕"],
        ["장하늘","6세","유치부"],
        ["탁예라","3세","유치부"]
      ]
    },
    {
      group: "11조",
      leader: "강유진, 박하늬",
      students: [
        ["차기쁨","중3","대곡"],
        ["권소양","중3","대곡"],
        ["박진우","5학년","구덕"],
        ["권민찬","3학년","구덕"],
        ["허재준","1학년","구덕"],
        ["김율","5세","유치부"],
        ["장가을","4세","유치부"]
      ]
    }
  ];

  const container = document.getElementById("groups");

  groupsData.forEach((g, i) => {
    const box = document.createElement("div");
    box.className = "group-box";

    const header = document.createElement("div");
    header.className = "group-header";
    header.style.background = groupColors[i];
    header.textContent = `${groupIcons[i]} ${g.group} — 조장: ${g.leader}`;

    const content = document.createElement("div");
    content.className = "group-content";

    const list = document.createElement("div");
    list.className = "student-list";

    g.students.forEach(s => {
      const item = document.createElement("div");
      item.className = "student-item";

      const dot = document.createElement("span");
      dot.className = "grade-dot";
      dot.style.background = gradeColor(s[1]);

      const text = document.createElement("span");
      text.textContent = `${s[0]} (${s[1]}, ${s[2]})`;

      item.appendChild(dot);
      item.appendChild(text);
      list.appendChild(item);
    });

    content.appendChild(list);
    box.appendChild(header);
    box.appendChild(content);
    container.appendChild(box);
  });
</script>

</body>
</html>
