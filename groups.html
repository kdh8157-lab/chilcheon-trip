<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성경학교 조편성표</title>

<style>
  body {
    font-family: system-ui;
    background: #f7f7f7;
    padding: 20px;
  }

  h1 {
    text-align: center;
    margin-bottom: 15px;
  }

  /* 안내 박스 */
  .info-box {
    background: #ffffff;
    padding: 15px;
    border-radius: 12px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    margin-bottom: 20px;
    font-size: 0.95rem;
    line-height: 1.7;
  }

  .info-box div {
    margin-bottom: 6px;
  }

  .dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
  }

  .group-box {
    background: #fff;
    border-radius: 12px;
    margin-bottom: 15px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    overflow: hidden;
  }

  .group-header {
    padding: 15px;
    color: white;
    font-size: 1.1rem;
    font-weight: 700;
  }

  .leader-list {
    margin-bottom: 12px;
    padding-left: 5px;
  }

  .leader-item {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }

  .group-content {
    padding: 15px;
    background: #fafafa;
    font-size: 0.95rem;
  }

  .student-list {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 15px;
  }

  .student-item {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .back-btn {
    display: block;
    width: 100%;
    text-align: center;
    padding: 12px;
    background: #6c5ce7;
    color: white;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
    margin-top: 20px;
  }
</style>
</head>

<body>

<h1>📚 성경학교 조편성표</h1>

<!-- 요일별 색상 규칙 안내 -->
<div class="info-box">
  <strong>📅 요일별 색상 규칙</strong><br><br>
  <div><span class="dot" style="background:#3498db;"></span> 토요일만 오는 친구</div>
  <div><span class="dot" style="background:#2ecc71;"></span> 금요일만 오는 친구</div>
  <div><span class="dot" style="background:#bdc3c7;"></span> 금·토 모두 오는 친구</div>
</div>

<div id="groups"></div>

<a class="back-btn" href="index.html">← 메인으로 돌아가기</a>

<script>
  const groupIcons = ["🐳","🐬","🐢","🐟","🐙","🦀","🐠","🐡","🦑","🐋","🌊"];

  /* 1~7조 기존 색상, 8~11조 파란색 */
  const groupColors = [
    "#6c5ce7", "#f39c12", "#00b894", "#fdcb6e", "#e17055",
    "#d63031", "#00cec9",
    "#3498db", "#3498db", "#3498db", "#3498db"
  ];

  function dayColor(day) {
    if (day === "sat") return "#3498db";   // 파란색
    if (day === "fri") return "#2ecc71";   // 초록색
    return "#bdc3c7";                      // 기본
  }

  const groupsData = [
    {
      group: "1조",
      leader: [
        ["정하은","both"],
        ["김정태","both"]
      ],
      students: [
        ["차영광","5학년","대곡","both"],
        ["오하람","5학년","구덕","both"],
        ["김리주","3학년","구덕","both"],
        ["이찬빈","2학년","구덕","sat"],
        ["김보경","4세","유치부","both"]
      ]
    },

    {
      group: "2조",
      leader: [
        ["김다은","both"],
        ["주익한","sat"],
        ["박지은","sat"]
      ],
      students: [
        ["신예정","4학년","대곡","both"],
        ["김도연","4학년","구덕","both"],
        ["김보민","3학년","구덕","both"],
        ["오현우","7세","구덕","fri"],
        ["허아현","2세","유치부","sat"]
      ]
    },

    {
      group: "3조",
      leader: [
        ["이주현","both"],
        ["이홍은","both"],
        ["정은경","sat"]
      ],
      students: [
        ["김시온","6학년","대곡","both"],
        ["오하율","4학년","구덕","both"],
        ["오민하","3학년","구덕","fri"],
        ["이나은","1학년","구덕","both"],
        ["최혜온","6세","유치부","sat"]
      ]
    },

    {
      group: "4조",
      leader: [
        ["이수연","both"],
        ["이황인","both"]
      ],
      students: [
        ["김도윤","4학년","대곡","sat"],
        ["김늘찬","2학년","구덕","both"],
        ["이가빈","1학년","구덕","both"],
        ["김선우","4학년","구덕","sat"],
        ["모준서","5세","유치부","sat"]
      ]
    },

    {
      group: "5조",
      leader: [
        ["김재현a","both"],
        ["김은진","both"]
      ],
      students: [
        ["김도현","2학년","대곡","sat"],
        ["이예빈","4학년","구덕","both"],
        ["양다은","2학년","구덕","both"],
        ["진세준","7세","유치부","both"]
      ]
    },

    {
      group: "6조",
      leader: [
        ["박근혜","both"],

      ],
      students: [
        ["김열매","5학년","구덕","both"],

      ]
    },

    {

      ],

    {

    {

      ],
      students: [
        ["신범준","중1","대곡","sat"],

    {
      group: "10조",
      leader: [

      ],
      students: [
        ["권보현","중1","대곡","sat"],
        ["박선우","6학년","구덕","sat"],
        ["김효주","중1","구덕","sat"],
        ["이동호","1학년","구덕","sat"],
        ["장하늘","6세","유치부","sat"],
        ["탁예라","3세","유치부","sat"]
      ]
    },

    {
      group: "11조",
      leader: [
        ["강유진","sat"],
        ["박하늬","sat"]
      ],
      students: [
        ["차기쁨","중3","대곡","sat"],
        ["권소양","중3","대곡","sat"],
        ["박진우","6학년","구덕","sat"],
        ["권민찬","3학년","구덕","sat"],
        ["허재준","1학년","구덕","sat"],
        ["김율","5세","유치부","sat"],
        ["장가을","4세","유치부","sat"]
      ]
    }
  ];

  const container = document.getElementById("groups");

  groupsData.forEach((g, i) => {
    const box = document.createElement("div");
    box.className = "group-box";

    const header = document.createElement("div");
    header.className = "group-header";
    header.style.background = groupColors[i];
    header.textContent = `${groupIcons[i]} ${g.group}`;

    const content = document.createElement("div");
    content.className = "group-content";

    /* 조장 표시 */
    const leaderList = document.createElement("div");
    leaderList.className = "leader-list";

    g.leader.forEach(l => {
      const leaderItem = document.createElement("div");
      leaderItem.className = "leader-item";

      const dayDot = document.createElement("span");
      dayDot.className = "dot";
      dayDot.style.background = dayColor(l[1]);

      const name = document.createElement("span");
      name.textContent = `${l[0]} (조장)`;

      leaderItem.appendChild(dayDot);
      leaderItem.appendChild(name);
      leaderList.appendChild(leaderItem);
    });

    content.appendChild(leaderList);

    /* 학생 표시 */
    const list = document.createElement("div");
    list.className = "student-list";

    g.students.forEach(s => {
      const item = document.createElement("div");
      item.className = "student-item";

      const dayDot = document.createElement("span");
      dayDot.className = "dot";
      dayDot.style.background = dayColor(s[3]);

      const text = document.createElement("span");
      text.textContent = `${s[0]} (${s[1]}, ${s[2]})`;

      item.appendChild(dayDot);
      item.appendChild(text);
      list.appendChild(item);
    });

    content.appendChild(list);
    box.appendChild(header);
    box.appendChild(content);
    container.appendChild(box);
  });
</script>

</body>
</html>
