<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>성경학교 조편성표</title>

<style>
  body {
    font-family: system-ui;
    background: #f7f7f7;
    padding: 20px;
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
  }

  .group-box {
    background: #fff;
    border-radius: 12px;
    margin-bottom: 15px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    overflow: hidden;
  }

  .group-header {
    padding: 15px;
    color: white;
    font-size: 1.1rem;
    font-weight: 700;
  }

  .group-content {
    padding: 15px;
    background: #fafafa;
    font-size: 0.95rem;
  }

  .student-list span {
    display: block;
    margin-bottom: 6px;
  }

  .back-btn {
    display: block;
    width: 100%;
    text-align: center;
    padding: 12px;
    background: #6c5ce7;
    color: white;
    border-radius: 10px;
    text-decoration: none;
    font-weight: 600;
    margin-top: 20px;
  }
</style>
</head>

<body>

<h1>📚 성경학교 조편성표</h1>

<div id="groups"></div>

<a class="back-btn" href="index.html">← 메인으로 돌아가기</a>

        "양다은 (2학년, 구덕)",
        "진세준 (7세, 유치부)"
      ]
    },
    {
      group: "6조",
      leader: "박근혜, 김수겸, 김유진",

    {

      leader: "최용임, 한유정, 정여원",
      students: [
        "권보현 (중1, 대곡)",

    {
      group: "11조",
      leader: "강유진, 박하늬",
      students: [
        "차기쁨 (중3, 대곡)",
        "권소양 (중3, 대곡)",<br>
        "박진우 (5학년, 구덕)",
        "권민찬 (3학년, 구덕)",<br>
        "허재준 (1학년, 구덕)",
        "김율 (5세, 유치부)",<br>
        "장가을 (4세, 유치부)"
      ]
    }
  ];

  const container = document.getElementById("groups");

  groupsData.forEach((g, i) => {
    const box = document.createElement("div");
    box.className = "group-box";

    const header = document.createElement("div");
    header.className = "group-header";
    header.style.background = colors[i];
    header.textContent = `${g.group} — 조장: ${g.leader}`;

    const content = document.createElement("div");
    content.className = "group-content";

    g.students.forEach(s => {
      const item = document.createElement("span");
      item.textContent = s;
      content.appendChild(item);
    });

    box.appendChild(header);
    box.appendChild(content);
    container.appendChild(box);
  });
</script>

</body>
</html>
